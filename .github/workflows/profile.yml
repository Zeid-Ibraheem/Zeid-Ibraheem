# Regenerates every stats card of the profile README as static SVG files in profile/.
# Nothing is fetched when someone views the profile: the images live in this repo.
name: profile

on:
  schedule:
    - cron: "17 4 * * *"        # every day at 04:17 UTC
  workflow_dispatch:            # manual run: gh workflow run profile.yml
  push:
    branches: [main]
    paths: [".github/workflows/profile.yml"]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    env:
      # Personal token (classic, no scope) stored as secret METRICS_TOKEN.
      # Without it, the isometric calendar is skipped and the other cards use the default token.
      HAS_PAT: ${{ secrets.METRICS_TOKEN != '' }}
      THEME: bg_color=0d1117&border_color=30363d&title_color=7ee787&icon_color=7ee787&text_color=c9d1d9&ring_color=7ee787&border_radius=10
    steps:
      - uses: actions/checkout@v6

      - run: mkdir -p profile

      # ── GitHub stats (successor of github-readme-stats, run inside this workflow)
      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: show_icons=true&include_all_commits=true&rank_icon=github&hide=issues&${{ env.THEME }}
          path: profile/stats.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: layout=compact&langs_count=8&${{ env.THEME }}
          path: profile/top-langs.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      # ── Contribution streak: downloaded once a day; if the service is down, the previous card is kept
      - name: Streak card
        run: |
          url="https://streak-stats.demolab.com/?user=${{ github.repository_owner }}&timezone=Europe/Paris&background=0d1117&border=30363d&stroke=30363d&ring=7ee787&fire=7ee787&currStreakNum=f0f6fc&sideNums=f0f6fc&currStreakLabel=7ee787&sideLabels=8b949e&dates=6e7681&border_radius=10"
          if curl -fsSL --retry 3 --max-time 30 -o profile/streak.tmp "$url" && grep -q "<svg" profile/streak.tmp; then
            mv profile/streak.tmp profile/streak.svg
          else
            rm -f profile/streak.tmp
            echo "::warning::streak service unreachable, keeping previous card"
          fi

      # ── Isometric 3D contribution calendar (lowlighter/metrics)
      - name: Isometric calendar
        if: env.HAS_PAT == 'true'
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: isocalendar.svg
          output_action: none
          base: ""
          config_timezone: Europe/Paris
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Collect isometric calendar
        if: env.HAS_PAT == 'true'
        run: |
          if [ -f /metrics_renders/isocalendar.svg ]; then
            sudo cp /metrics_renders/isocalendar.svg profile/isocalendar.svg
            sudo chown "$(id -u):$(id -g)" profile/isocalendar.svg
          fi

      # ── Snake eating the contribution grid (light + dark versions)
      - name: Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg?palette=github-light
            profile/snake-dark.svg?palette=github-dark&color_snake=#7ee787

      # ── Commit only if something changed
      - name: Commit cards
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "chore: refresh profile cards"
          git pull --rebase origin main
          git push
