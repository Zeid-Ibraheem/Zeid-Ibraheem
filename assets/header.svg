<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#21262d"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#0d1117" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#7ee787" stop-opacity="0"/>
      <stop offset="1" stop-color="#7ee787" stop-opacity="0.10"/>
    </linearGradient>
    <clipPath id="win"><rect x="790" y="45" width="408" height="293" rx="12"/></clipPath>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="1198" height="338" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="336" rx="13" fill="url(#grid)"/>

  <!-- radar sweep over the network side -->
  <g clip-path="url(#win)">
    <g>
      <rect x="0" y="45" width="140" height="295" fill="url(#sweep)"/>
      <rect x="139" y="45" width="1.5" height="295" fill="#7ee787" fill-opacity="0.35"/>
      <animateTransform attributeName="transform" type="translate" values="650 0;1200 0" dur="4.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <rect x="2" y="45" width="780" height="293" fill="url(#fade)"/>

  <!-- title bar -->
  <path d="M1 44 H1199" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="28" cy="23" r="6" fill="#30363d"/>
  <circle cx="48" cy="23" r="6" fill="#30363d"/>
  <circle cx="68" cy="23" r="6" fill="#30363d"/>
  <text x="600" y="28" text-anchor="middle" class="mono" font-size="14" fill="#6e7681">zeid@archi: ~ — ssh · 10.0.0.42</text>

  <!-- network topology -->
  <g stroke="#30363d" stroke-width="1.5">
    <line x1="850" y1="115" x2="975" y2="92"/>
    <line x1="975" y1="92" x2="1095" y2="130"/>
    <line x1="850" y1="115" x2="905" y2="212"/>
    <line x1="975" y1="92" x2="905" y2="212"/>
    <line x1="975" y1="92" x2="1025" y2="225"/>
    <line x1="1095" y1="130" x2="1025" y2="225"/>
    <line x1="905" y1="212" x2="1025" y2="225"/>
    <line x1="1025" y1="225" x2="1130" y2="275"/>
    <line x1="1095" y1="130" x2="1130" y2="275"/>
    <line x1="905" y1="212" x2="830" y2="282"/>
    <line x1="850" y1="115" x2="830" y2="282"/>
  </g>
  <!-- encrypted tunnel (dashed) -->
  <path d="M830 282 Q 960 330 1130 275" fill="none" stroke="#7ee787" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="4 6">
    <animate attributeName="stroke-dashoffset" values="0;-20" dur="1s" repeatCount="indefinite"/>
  </path>

  <!-- packets -->
  <circle r="3" fill="#7ee787">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M850 115 L975 92 L1025 225"/>
  </circle>
  <circle r="3" fill="#c9d1d9" opacity="0.8">
    <animateMotion dur="4.1s" repeatCount="indefinite" path="M830 282 L905 212 L1025 225 L1130 275"/>
  </circle>
  <circle r="2.5" fill="#f0883e">
    <animateMotion dur="5.3s" repeatCount="indefinite" path="M1095 130 L975 92 L850 115 L830 282"/>
  </circle>

  <g fill="#0d1117" stroke="#8b949e" stroke-width="2">
    <circle cx="850" cy="115" r="7"/>
    <circle cx="975" cy="92" r="7"/>
    <circle cx="1095" cy="130" r="7"/>
    <circle cx="905" cy="212" r="7"/>
    <circle cx="1130" cy="275" r="7"/>
    <circle cx="830" cy="282" r="7"/>
  </g>
  <circle cx="1025" cy="225" r="7" fill="none" stroke="#7ee787" stroke-width="2">
    <animate attributeName="r" values="7;22;22" keyTimes="0;0.7;1" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0" keyTimes="0;0.7;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1025" cy="225" r="7" fill="#7ee787"/>

  <!-- node labels -->
  <g class="mono" font-size="11" fill="#484f58">
    <text x="975" y="74" text-anchor="middle">gw 10.0.0.1</text>
    <text x="1095" y="112" text-anchor="middle">dns</text>
    <text x="850" y="97" text-anchor="middle">fw</text>
    <text x="830" y="306" text-anchor="middle">wg0</text>
    <text x="1130" y="299" text-anchor="middle">homelab</text>
  </g>
  <text x="1043" y="229" class="mono" font-size="12" fill="#7ee787">zeid</text>

  <!-- text -->
  <text x="60" y="135" class="mono" font-size="58" font-weight="700" letter-spacing="2" fill="#f0f6fc">ZEID IBRAHEEM</text>
  <text x="62" y="180" class="mono" font-size="21" fill="#8b949e">Networks · Security · Systems</text>
  <text x="62" y="216" class="mono" font-size="17" fill="#6e7681">BUT R&amp;T @ IUT Nancy-Brabois → engineering school</text>

  <text x="62" y="288" class="mono" font-size="19">
    <tspan fill="#7ee787">zeid@archi</tspan><tspan fill="#6e7681"> ~ $ </tspan><tspan fill="#c9d1d9">trust nothing, verify everything</tspan><tspan fill="#c9d1d9" class="blink"> █</tspan>
  </text>
</svg>
