<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#30363d"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#0d1117" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="1198" height="338" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="336" rx="13" fill="url(#dots)"/>
  <rect x="2" y="44" width="760" height="294" fill="url(#fade)"/>

  <!-- title bar -->
  <path d="M1 44 H1199" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="28" cy="23" r="6" fill="#30363d"/>
  <circle cx="48" cy="23" r="6" fill="#30363d"/>
  <circle cx="68" cy="23" r="6" fill="#30363d"/>
  <text x="600" y="28" text-anchor="middle" class="mono" font-size="14" fill="#6e7681">zeid@archi: ~</text>

  <!-- network graph -->
  <g stroke="#30363d" stroke-width="1.5">
    <line x1="840" y1="120" x2="960" y2="95"/>
    <line x1="960" y1="95" x2="1085" y2="135"/>
    <line x1="840" y1="120" x2="900" y2="215"/>
    <line x1="960" y1="95" x2="900" y2="215"/>
    <line x1="960" y1="95" x2="1020" y2="225"/>
    <line x1="1085" y1="135" x2="1020" y2="225"/>
    <line x1="900" y1="215" x2="1020" y2="225"/>
    <line x1="1020" y1="225" x2="1125" y2="270"/>
    <line x1="1085" y1="135" x2="1125" y2="270"/>
    <line x1="900" y1="215" x2="815" y2="280"/>
    <line x1="840" y1="120" x2="815" y2="280"/>
  </g>

  <!-- packets -->
  <circle r="3" fill="#7ee787">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M840 120 L960 95 L1020 225"/>
  </circle>
  <circle r="3" fill="#c9d1d9" opacity="0.8">
    <animateMotion dur="4.1s" repeatCount="indefinite" path="M815 280 L900 215 L1020 225 L1125 270"/>
  </circle>

  <g fill="#0d1117" stroke="#8b949e" stroke-width="2">
    <circle cx="840" cy="120" r="7"/>
    <circle cx="960" cy="95" r="7"/>
    <circle cx="1085" cy="135" r="7"/>
    <circle cx="900" cy="215" r="7"/>
    <circle cx="1125" cy="270" r="7"/>
    <circle cx="815" cy="280" r="7"/>
  </g>
  <circle cx="1020" cy="225" r="7" fill="none" stroke="#7ee787" stroke-width="2">
    <animate attributeName="r" values="7;22;22" keyTimes="0;0.7;1" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0" keyTimes="0;0.7;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1020" cy="225" r="7" fill="#7ee787"/>

  <!-- text -->
  <text x="60" y="140" class="mono" font-size="58" font-weight="700" letter-spacing="2" fill="#f0f6fc">ZEID IBRAHEEM</text>
  <text x="62" y="185" class="mono" font-size="21" fill="#8b949e">Networks &amp; Telecom · Systems · Self-hosting</text>
  <text x="62" y="222" class="mono" font-size="17" fill="#6e7681">BUT R&amp;T @ IUT Nancy-Brabois → engineering school</text>

  <text x="62" y="288" class="mono" font-size="19">
    <tspan fill="#7ee787">zeid@archi</tspan><tspan fill="#6e7681"> ~ $ </tspan><tspan fill="#c9d1d9">make it work, make it right, make it fast</tspan><tspan fill="#c9d1d9" class="blink"> █</tspan>
  </text>
</svg>
